name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Synthesize CloudFormation
        run: npm run synth -- --no-lookups

      - name: Verify default refine flags
        run: node scripts/assert-refine-flags.mjs 0 false

      - name: Synthesize refine canary
        run: npm run synth -- --no-lookups -c refineEnabled=true -c refineFeatureEnabled=false

      - name: Verify refine canary flags
        run: node scripts/assert-refine-flags.mjs 1 false

      - name: Synthesize full refine rollout
        run: npm run synth -- --no-lookups -c refineEnabled=true -c refineFeatureEnabled=true

      - name: Verify full refine flags
        run: node scripts/assert-refine-flags.mjs 1 true

      - name: Reject BFF-only refine exposure
        shell: bash
        run: |
          if npm run synth -- --no-lookups -c refineEnabled=false -c refineFeatureEnabled=true; then
            echo "BFF-only refine exposure must fail synthesis."
            exit 1
          fi

      - name: Upload synthesized templates
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v4
        with:
          name: standin-cdk-${{ github.run_number }}
          path: cdk.out/*.template.json
          if-no-files-found: error
          retention-days: 14
