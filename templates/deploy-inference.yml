# Standin-server 저장소의 .github/workflows/deploy.yml 로 복사해서 쓴다.
#
# 장기 액세스 키를 쓰지 않는다 — GitHub이 실행마다 발급하는 OIDC 토큰으로
# AWS 역할을 assume한다. 저장소 시크릿에 남는 자격증명이 없다.
#
# ── 브랜치 → 환경 ───────────────────────────────────────────────
#   develop → GitHub environment `staging` → StandinStagingApp
#   main    → GitHub environment `beta`    → StandinApp (프로덕션)
#
# OIDC 역할은 **보호된 environment에 붙은 job만** 신뢰한다(StandinCicd의 신뢰 정책).
# 아래 `environment:` 를 지우면 role assume이 실패한다 — 편의 기능이 아니라 접근 통제다.
#
# ── 필요한 변수 ─────────────────────────────────────────────────
# 저장소 변수(Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION       예: ap-northeast-2
#   AWS_DEPLOY_ROLE  StandinCicd 스택의 DeployRoleArn 출력값
#
# **environment 변수**(Settings → Environments → beta / staging → Variables):
#   ECS_CLUSTER      해당 환경 스택 출력의 ClusterName
#   ECS_SERVICE      해당 환경 스택 출력의 InferenceServiceName
#
# 클러스터·서비스 이름을 environment 변수로 두는 이유: 이름에 CDK가 붙인 해시가 들어가
# 환경마다 다르다. 워크플로에 하드코딩하면 staging 배포가 프로덕션으로 나갈 수 있다.
name: deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# OIDC 토큰 발급에 필요하다. 없으면 role assume이 실패한다.
permissions:
  id-token: write
  contents: read

concurrency:
  # 환경별로 나눈다 — staging 배포가 진행 중인 프로덕션 배포를 막지 않는다.
  group: deploy-inference-${{ github.ref_name }}
  cancel-in-progress: false # 배포는 중간에 끊지 않는다

env:
  # 저장소는 두 환경이 공유한다. staging에서 검증한 **그 SHA**를 프로덕션에 올린다.
  ECR_REPOSITORY: standin/inference

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main 이외의 브랜치는 전부 staging으로 간다. 프로덕션은 main만이다.
    environment: ${{ github.ref == 'refs/heads/main' && 'beta' || 'staging' }}
    env:
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 이미지를 만들기 전에 깨진 코드를 거른다.
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 추론 태스크는 x86_64다(CDK 태스크 정의와 일치). 러너와 같아 크로스 빌드가 없다.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 현재 서비스가 쓰는 태스크 정의에서 출발한다.
      # 패밀리 이름을 추측하지 않는다 — CDK가 붙인 이름은 환경마다 다르고, 틀린 패밀리를
      # 집으면 엉뚱한 정의 위에 이미지를 얹어 배포한다.
      - name: Render task definition
        id: taskdef
        run: |
          taskdef_arn=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          if [ -z "$taskdef_arn" ] || [ "$taskdef_arn" = "None" ]; then
            echo "service $ECS_SERVICE not found in cluster $ECS_CLUSTER"
            exit 1
          fi
          aws ecs describe-task-definition --task-definition "$taskdef_arn" --query taskDefinition > taskdef.json
          echo "path=taskdef.json" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: ${{ steps.taskdef.outputs.path }}
          container-name: inference
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # 배포가 안정될 때까지 기다린다. 실패하면 ECS 서킷 브레이커가 롤백한다.
          wait-for-service-stability: true
